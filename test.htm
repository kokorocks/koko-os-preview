<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Proximity Effect</title>
    <style>
        :root {
            --bg-color: #050508;
            --phone-border: #1a1a24;
            /* Default colors, will be overwritten by JS based on the image */
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff0055;
            --neon-purple: #8a2be2;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 50%, #111 0%, #000 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* --- THE PHONE --- */
        .phone {
            width: 320px;
            height: 600px;
            background-color: var(--bg-color);
            border-radius: 55px;
            border: 12px solid var(--phone-border);
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 
                        inset 0 0 20px rgba(255,255,255,0.05);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
        }

        /* --- DYNAMIC ISLAND --- */
        .dynamic-island {
            width: 100px;
            height: 30px;
            background-color: #000;
            border-radius: 20px;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            transition: all 0.4s cubic-bezier(0.5, 2, 0.5, 0.8);
            box-shadow: 0 0 0px transparent;
        }

        /* --- GLOW EFFECTS --- */
        .glow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .glow-core, .glow-color, .shockwave {
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            border-radius: 50%;
            opacity: 0;
            mix-blend-mode: color-dodge;
        }

        .glow-core {
            width: 250px;
            height: 250px;
            background: #ffffff;
            filter: blur(40px);
            z-index: 3;
            transition: all 0.8s cubic-bezier(0.1, 1, 0.3, 1);
        }

        .glow-color {
            width: 500px;
            height: 500px;
            background: conic-gradient(from 180deg at 50% 50%, var(--neon-cyan), var(--neon-purple), var(--neon-magenta), var(--neon-cyan));
            filter: blur(60px);
            z-index: 2;
            transition: all 1s cubic-bezier(0.1, 1, 0.3, 1);
        }

        .shockwave {
            width: 300px;
            height: 300px;
            border: 10px solid var(--neon-cyan);
            filter: blur(8px);
            z-index: 4;
            mix-blend-mode: screen;
        }

        /* --- THE CONTENT CARD --- */
        .content-card {
            width: 260px;
            height: 380px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            margin: 120px auto 0;
            position: relative;
            z-index: 5;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* Specular Glass Reflection Sweep */
        .content-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 55%
            );
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: none;
            z-index: 10;
        }

        .content-card img {
            width: 100%;
            height: 82%;
            object-fit: cover;
        }

        .content-card .info {
            padding: 15px;
            text-align: center;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- MICRO PARTICLES --- */
        .particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 8;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            opacity: 0;
            top: 200px;
        }

        /* --- SUCCESS BADGE --- */
        .success-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) scale(0.5) translateY(-50px);
            background: rgba(0, 255, 100, 0.2);
            border: 1px solid rgba(0, 255, 100, 0.5);
            color: #00ff88;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            opacity: 0;
            z-index: 110;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.4);
        }

        /* --- ANIMATION STATES --- */

        /* 1. Impact (The "Bump") */
        .phone.is-bumping { transform: scale(0.98) translateY(10px); }
        .phone.is-bumping .glow-core { opacity: 1; transform: translateX(-50%) scale(1) translateY(60px); }
        .phone.is-bumping .glow-color {
            opacity: 0.9;
            transform: translateX(-50%) scale(1.1) translateY(80px);
            animation: spin 3s linear infinite;
        }
        .phone.is-bumping .shockwave { animation: blast 0.8s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; }
        .phone.is-bumping .content-card {
            transform: translateY(40px) scale(0.92) rotateX(-10deg); 
            box-shadow: 0 -20px 60px var(--neon-cyan);
            filter: brightness(1.2);
        }
        
        /* Trigger Specular Sheen */
        .phone.is-bumping .content-card::after { transform: rotate(30deg) translateY(100%); }

        /* 2. Warp Speed (Sucking into the Island) */
        .phone.is-sending .content-card {
            transform: translateY(-400px) scaleX(0.1) scaleY(1.5) perspective(500px) rotateX(45deg); 
            opacity: 0;
            filter: blur(15px) brightness(2);
            transition: all 0.4s cubic-bezier(0.8, -0.1, 0.1, 1);
        }
        .phone.is-sending .glow-core,
        .phone.is-sending .glow-color {
            transform: translateX(-50%) scale(0.2) translateY(-100px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.5, 0, 0, 1);
        }
        .phone.is-sending .dynamic-island {
            width: 140px;
            height: 40px;
            border-radius: 25px;
            box-shadow: 0 0 30px var(--neon-cyan), inset 0 0 10px rgba(255,255,255,0.5);
            background-color: #111;
        }
        
        /* Fire particles */
        .phone.is-sending .particle { animation: absorb 0.4s cubic-bezier(0.5, 0, 1, 1) forwards; }

        /* 3. Success Notification */
        .phone.is-sent .success-badge {
            opacity: 1;
            transform: translateX(-50%) scale(1) translateY(40px);
        }
        .phone.is-sent .dynamic-island {
            width: 100px;
            height: 30px;
            box-shadow: 0 0 0 transparent;
            background-color: #000;
        }

        /* Controls */
        .controls { margin-top: 50px; }
        button {
            background: linear-gradient(135deg, var(--neon-magenta) 0%, var(--neon-cyan) 100%);
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 900;
            color: white;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        button:hover { transform: translateY(-4px) scale(1.05); }
        button:active { transform: translateY(2px) scale(0.95); }

        /* Keyframes */
        @keyframes spin { 100% { transform: translateX(-50%) scale(1.1) translateY(80px) rotate(360deg); } }
        @keyframes blast {
            0% { opacity: 1; transform: translateX(-50%) scale(0) translateY(40px); border-width: 20px; }
            100% { opacity: 0; transform: translateX(-50%) scale(2.5) translateY(100px); border-width: 0px; }
        }
        @keyframes absorb {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-200px) scale(0); }
        }
    </style>
</head>
<body>

    <div class="phone" id="phone">
        <div class="dynamic-island"></div>
        <div class="success-badge">AirDrop Sent ✨</div>
        
        <div class="glow-container">
            <div class="shockwave"></div>
            <div class="glow-color"></div>
            <div class="glow-core"></div>
        </div>

        <div class="particles-container" id="particles">
            <!-- Particles generated by JS -->
        </div>

        <div class="content-card" id="card">
            <!-- crossorigin="anonymous" is required for JS to read the image colors -->
            <img id="transfer-img" src="https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?q=80&w=2564&auto=format&fit=crop" crossorigin="anonymous" alt="Epic 3D Art">
            <div class="info">HYPER_SPACE.RAW</div>
        </div>
    </div>

    <div class="controls">
        <button id="bumpBtn">Initiate Transfer</button>
    </div>

    <script>
        const btn = document.getElementById('bumpBtn');
        const phone = document.getElementById('phone');
        const img = document.getElementById('transfer-img');
        const particlesContainer = document.getElementById('particles');

        // --- 1. Dynamic Color Extraction ---
        img.onload = () => {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 1; 
                canvas.height = 1;
                ctx.drawImage(img, 0, 0, 1, 1);
                const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
                
                // Adjust colors based on image dominant pixel
                document.documentElement.style.setProperty('--neon-cyan', `rgb(${r}, ${g}, ${b})`);
                document.documentElement.style.setProperty('--neon-magenta', `rgb(${b}, ${r}, ${g})`);
            } catch (e) {
                // Failsafe if running locally without a server due to CORS
                console.log("Canvas color extraction blocked by CORS, using default neon colors.");
            }
        };

        // --- 2. Generate Micro-Particles ---
        for (let i = 0; i < 6; i++) {
            let p = document.createElement('div');
            p.classList.add('particle');
            // Randomize starting positions slightly
            p.style.left = `calc(50% + ${Math.random() * 100 - 50}px)`;
            // Randomize animation delay so they trail upwards
            p.style.animationDelay = `${Math.random() * 0.15}s`;
            particlesContainer.appendChild(p);
        }

        // --- 3. Synthesized Audio Setup ---
        let audioCtx;
        function playAirDropSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Low frequency haptic thump (Impact)
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);

            // High shimmer pitch (Success Chime)
            setTimeout(() => {
                const chime = audioCtx.createOscillator();
                const chimeGain = audioCtx.createGain();
                chime.type = 'sine';
                chime.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 note
                chime.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.2); // A6 note
                
                chimeGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                chimeGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                
                chime.connect(chimeGain);
                chimeGain.connect(audioCtx.destination);
                chime.start();
                chime.stop(audioCtx.currentTime + 0.2);
            }, 700);
        }

        // --- 4. Main Animation Sequence ---
        btn.addEventListener('click', () => {
            if (phone.classList.contains('is-bumping') || phone.classList.contains('is-sending')) return;

            // Trigger physical haptics if available
            if (navigator.vibrate) navigator.vibrate([30, 80, 30]); 
            
            // Trigger synthesized audio
            playAirDropSound();

            // Phase 1: Heavy impact, glass sheen swipe, energy build-up
            phone.classList.add('is-bumping');

            // Phase 2: Ultra-fast warp send & Particle Fire
            setTimeout(() => {
                if (navigator.vibrate) navigator.vibrate(100); 
                phone.classList.remove('is-bumping'); 
                phone.classList.add('is-sending');
            }, 700);

            // Phase 3: Pop the success badge out of the island
            setTimeout(() => {
                phone.classList.add('is-sent');
            }, 1100); 

            // Phase 4: Reset UI flawlessly
            setTimeout(() => {
                phone.classList.remove('is-sending', 'is-sent');
                
                // Temporarily disable transition on the card so it snaps back to start instantly
                const card = document.getElementById('card');
                card.style.transition = 'none';
                
                // Re-clone particles to reset their animations
                const particles = document.querySelectorAll('.particle');
                particles.forEach(p => {
                    p.style.animation = 'none';
                    p.offsetHeight; // Trigger reflow
                    p.style.animation = null; 
                });

                setTimeout(() => card.style.transition = '', 50);

            }, 3500);
        });
    </script>
</body>
</html>
